name: Release

# Builds the three backend binaries for linux x86_64 + aarch64 and attaches them
# (one tar.gz per arch + SHA256SUMS) to the GitHub Release for the tag.
#
#   * push of a `v*` tag      -> release that tag
#   * workflow_dispatch(tag)  -> (re)release an EXISTING tag, e.g. v0.4.1:
#       gh workflow run release.yml -f tag=v0.4.1
#
# Idempotent: if the release already exists its assets are overwritten
# (`gh release upload --clobber`) and its notes refreshed.
#
# Linkage: libSz (the Senzing engine) is a glibc shared library that build.rs
# links as `dylib=Sz`, so the binaries cannot be static/musl. Everything else is
# Rust-static: TLS is rustls (no OpenSSL), and the "Check linkage" step fails
# the build if any DT_NEEDED entry other than libSz + glibc + libgcc_s appears.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.4.1)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # build.rs links dylib=Sz from here; provided by the Senzing runtime container.
  SENZING_LIB_PATH: /opt/senzing/er/lib
  LD_LIBRARY_PATH: /opt/senzing/er/lib
  BINS: sz_rabbit_combined_consumer sz_sqs_combined_consumer sz_activemq_combined_consumer

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve and validate tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (linux ${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # Native arm64 runner; senzingsdk-runtime is published for linux/arm64.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Build inside the pinned Senzing runtime (same image + glibc as CI and the
    # Docker image), which ships /opt/senzing/er/lib for this arch. `--user root`
    # so apt / rustup can write.
    container:
      image: senzing/senzingsdk-runtime:4.3.3
      options: --user root
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Install build prerequisites
        # No libssl-dev: the dependency tree has no openssl-sys / native-tls.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned 2026-06-29)
        with:
          toolchain: 1.94.1

      - name: Cache cargo + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-release-

      - name: Build release binaries
        run: |
          PKGS=""
          for b in $BINS; do PKGS="$PKGS -p $b"; done
          # shellcheck disable=SC2086
          cargo build --release --locked $PKGS

      - name: Check linkage (only libSz + glibc + libgcc_s)
        run: |
          set -eu
          for b in $BINS; do
            f="target/release/$b"
            echo "=== $b"
            readelf -d "$f" | grep -E 'NEEDED|RPATH|RUNPATH' || true
            ldd "$f"
            bad="$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' \
              | grep -Ev '^(libSz\.so|libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|ld-linux-(x86-64|aarch64)\.so\.[0-9]+)$' || true)"
            if [ -n "$bad" ]; then echo "::error::$b has unexpected NEEDED: $bad"; exit 1; fi
          done

      - name: Smoke test (--version inside the Senzing runtime)
        run: for b in $BINS; do "target/release/$b" --version; done

      - name: Package
        run: |
          set -eu
          NAME="sz_queue_combined_consumer-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$NAME"
          for b in $BINS; do cp "target/release/$b" "dist/$NAME/"; done
          cp README.md LICENSE CHANGELOG.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          tar -tzvf "dist/$NAME.tar.gz"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        # Every `## X.Y.Z — …` section for this version (a release may span
        # several dated sections); empty -> fall back to generated notes.
        run: |
          VER="${TAG#v}"
          awk -v ver="$VER" '
            /^## / { p = (index($0, "## " ver " ") == 1) }
            p
          ' CHANGELOG.md > notes.md
          wc -l notes.md

      - name: Create or update release
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -s notes.md ]; then gh release edit "$TAG" --notes-file notes.md; fi
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            if [ -s notes.md ]; then NOTES="--notes-file notes.md"; else NOTES="--generate-notes"; fi
            # shellcheck disable=SC2086
            gh release create "$TAG" --verify-tag --title "$TAG" $NOTES dist/*.tar.gz dist/SHA256SUMS
          fi
