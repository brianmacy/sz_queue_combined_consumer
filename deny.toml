# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# TODO: Remove these ignores when upstream fixes are available
# These are transitive dependencies from lapin -> amq-protocol-tcp -> tcp-stream
# tracking: https://github.com/lapin-rs/lapin/issues
ignore = [
    # rustls-pemfile is unmaintained, should migrate to rustls-pki-types
    # Blocked by: tcp-stream needs to update its dependencies
    # Impact: Low - maintenance advisory, not a security vulnerability
    # Plan: Monitor tcp-stream releases, upgrade when fixed
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0009 (time < 0.3.47 RFC 2822 DoS) ignore REMOVED 2026-09-23:
    # Cargo.lock now resolves time 0.3.54, and cargo-deny >= 0.19 fails the
    # advisories check on an ignore that matches no crate.

    # rustls TLS 1.3 handshake messages accepted across encryption-level
    # boundaries (fixed in rustls >= 0.23.45).
    # Blocked by: MSRV 1.94.1 — the MSRV-aware resolver locks rustls 0.23.43;
    #   0.23.45 needs a newer rustc. Lift when the MSRV moves (Dockerfile, CI pins).
    # Impact: Low here — rustls is only the HTTPS *client* to AWS SQS endpoints
    #   (aws-smithy-http-client); the flaw concerns accepting malformed server
    #   handshakes, and the peer is AWS.
    # Plan: bump MSRV / rust-version, `cargo update -p rustls`, delete this.
    "RUSTSEC-2026-0285",
    # NOTE: the rustls-webpki 0.101.7 advisories (RUSTSEC-2026-0098/-0099/-0104)
    # that the SQS backend tripped under MSRV 1.88 are GONE at MSRV 1.94.1: the
    # AWS SDK now resolves aws-smithy-http-client >= 1.2 with the modern
    # rustls-aws-lc stack (rustls 0.23 / rustls-webpki 0.103.13), so the
    # vulnerable 0.101.7 is no longer in the build graph. No ignore needed.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    # Community Data License Agreement - Permissive 2.0. A permissive (non-
    # copyleft) data license used by webpki-root-certs, pulled transitively via
    # lapin -> amq-protocol-tcp -> tcp-stream -> rustls-connector. Consumer-only;
    # the redoer has no lapin/rustls dependency and does not carry this.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The Senzing Rust SDK is a public git dependency (pinned rev in Cargo.toml).
# It is not published to crates.io, so its git source must be explicitly allowed.
allow-git = ["https://github.com/brianmacy/sz-rust-sdk"]
