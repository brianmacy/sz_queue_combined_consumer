# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# TODO: Remove these ignores when upstream fixes are available
# These are transitive dependencies from lapin -> amq-protocol-tcp -> tcp-stream
# tracking: https://github.com/lapin-rs/lapin/issues
ignore = [
    # Empty on purpose (2026-09-23). Previously ignored and now resolved:
    #   RUSTSEC-2025-0134 rustls-pemfile unmaintained — crate no longer in Cargo.lock.
    #   RUSTSEC-2026-0009 time < 0.3.47 RFC 2822 DoS — Cargo.lock has time 0.3.54.
    #   RUSTSEC-2026-0285 rustls TLS 1.3 handshake — Cargo.lock has rustls 0.23.45
    #     (needs rustc 1.71, well under MSRV 1.94.1; `cargo update -p rustls` alone
    #     stopped at 0.23.43 only because aws-lc-rs/aws-lc-sys had to move with it).
    # cargo-deny >= 0.19 FAILS on an ignore that matches no crate, so do not park
    # stale entries here.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    # Community Data License Agreement - Permissive 2.0. A permissive (non-
    # copyleft) data license used by webpki-root-certs, pulled transitively via
    # lapin -> amq-protocol-tcp -> tcp-stream -> rustls-connector. Consumer-only;
    # the redoer has no lapin/rustls dependency and does not carry this.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The Senzing Rust SDK is a public git dependency (pinned rev in Cargo.toml).
# It is not published to crates.io, so its git source must be explicitly allowed.
# Since sz-rust-sdk v4.3.2 the FFI/marshaling layer lives in a sibling repo,
# sz-rust-sdk-ffi, which the SDK pins by rev in its own Cargo.toml.
allow-git = [
    "https://github.com/brianmacy/sz-rust-sdk",
    "https://github.com/brianmacy/sz-rust-sdk-ffi",
]
