[package]
name = "sz-combined-consumer-core"
description = "Broker-agnostic Senzing load + redo engine-processing core (worker pool, redo mixing, stats, live config reload, file loader) shared by the RabbitMQ and SQS driver binaries"
version.workspace = true
publish = false  # not published to crates.io
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "sz_combined_consumer_core"
path = "src/lib.rs"

[dependencies]
sz-rust-sdk.workspace = true
# tokio: the shared worker pool uses tokio::sync channels + Notify (no runtime is
# built here — the backend bins own the runtime). No lapin / no AMQP in core, so
# a backend bin that does not need AMQP (e.g. SQS) never compiles it.
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The shared runtime module (logging init + signal handler) used by every bin.
tracing-subscriber.workspace = true
ctrlc.workspace = true
num_cpus.workspace = true
# Record-transform plugin ABI + dlopen (libc) for the optional per-record hook.
sz-record-transform.workspace = true
libc.workspace = true
# INFO sink plugin ABI (dlopen'd like the transform plugin).
sz-info-sink.workspace = true
# `*.zst` input for the file loader (--input-file).
zstd.workspace = true

# `cargo llvm-cov` builds with `--cfg coverage` (runtime.rs writes the
# coverage profile before a forced `_exit`); declare it for check-cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[dev-dependencies]
# Built so the transform tests can dlopen the example plugin cdylib.
sz-record-transform-example = { path = "../transform-example" }
# Built so the INFO sink tests can dlopen the real file-sink plugin cdylib.
sz-info-sink-file = { path = "../info-sink-file" }
sz-info-sink-abi-v2-fixture = { path = "../info-sink-abi-v2-fixture" }
