# Test data for the queue-mode shutdown e2e tests in integration_test.rs
# (SIGHUP is graceful; a stuck worker cannot outlive the shutdown deadline).

# Lines the driver prints that the tests assert on.
markers:
  final_total: "Processed total of "
  shutdown_dead_letter: "REJECTING in-flight-in-worker on shutdown"

# SIGHUP must shut down exactly like SIGTERM: drain, exit 0, print the total.
sighup:
  queue: sz-combined-sighup-queue
  # Seconds allowed for the driver to exit after SIGHUP.
  exit_within_secs: 30
  records:
    - '{"DATA_SOURCE":"TEST","RECORD_ID":"E2E_SIGHUP_0","NAME_FULL":"Sighup Tester 0","ADDR_FULL":"0 Hangup St"}'
    - '{"DATA_SOURCE":"TEST","RECORD_ID":"E2E_SIGHUP_1","NAME_FULL":"Sighup Tester 1","ADDR_FULL":"1 Hangup St"}'
    - '{"DATA_SOURCE":"TEST","RECORD_ID":"E2E_SIGHUP_2","NAME_FULL":"Sighup Tester 2","ADDR_FULL":"2 Hangup St"}'

# One record blocks a worker (example transform plugin SLEEP_MS) far longer
# than the 10 s shutdown grace; SIGTERM must still end the process promptly
# and the in-worker record must reach the dead-letter queue.
deadline:
  queue: sz-combined-deadline-queue
  dead_letter_queue: sz-combined-deadline-dlq
  # Plugin sleep per record, milliseconds.
  sleep_ms: 60000
  # Seconds to let the delivered record reach a worker before SIGTERM.
  settle_secs: 3
  # Hard bound on SIGTERM -> process exit (grace is 10 s).
  exit_within_secs: 15
  record: '{"DATA_SOURCE":"TEST","RECORD_ID":"E2E_DEADLINE_0","NAME_FULL":"Deadline Stuck","ADDR_FULL":"0 Grace St"}'
