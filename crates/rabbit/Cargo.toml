[package]
name = "sz_rabbit_combined_consumer"
description = "Senzing combined load + redo driver, RabbitMQ backend (one redo% knob; subsumes sz_rabbit_consumer and sz_simple_redoer)"
version.workspace = true
publish = false  # not published to crates.io
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sz_rabbit_combined_consumer"
path = "src/main.rs"

[dependencies]
sz-combined-consumer-core.workspace = true
sz-rust-sdk.workspace = true
tokio.workspace = true
# lapin + futures-lite are RabbitMQ-only and live ONLY in this bin (combined.rs),
# so the SQS binary never compiles them.
lapin.workspace = true
futures-lite.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true

[dev-dependencies]
# The integration test spawns the binary and drives a real RabbitMQ/engine.
# libc: send SIGTERM via kill(2) (the senzingsdk-runtime CI container has no
# `kill` executable on PATH — Command::new("kill") would fail ENOENT).
libc.workspace = true
sz-rust-sdk.workspace = true
# YAML test fixtures (tests/fixtures/): data in YAML, not hardcoded.
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
# RabbitMQ management API responses (in-flight cap e2e).
serde_json.workspace = true
# Example record-transform cdylib, dlopened by the transform e2e test.
sz-record-transform-example = { path = "../transform-example" }
# File INFO sink cdylib, dlopened by the driver in the INFO sink e2e tests.
sz-info-sink-file = { path = "../info-sink-file" }
# INFO sink cdylib that fails / blocks on command (stuck-sink e2e tests).
sz-info-sink-fault-fixture = { path = "../info-sink-fault-fixture" }
# A genuine mid-run database failure in the e2e tests: DROP TABLE on a
# PRIVATE throwaway SQLite repository (never the one the test process's
# engine has open). The raw C API (bundled SQLite, MIT) keeps the dev tree
# small; rusqlite would add Zlib-licensed transitive crates.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
