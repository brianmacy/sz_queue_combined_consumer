# Test data for e2e_sqs_rejects_land_in_discovered_dlq_verbatim in sqs_e2e.rs:
# valid records, one unparseable message and one record the engine rejects
# (unknown DATA_SOURCE). Only the valid ones are adds; the other two are
# forwarded verbatim to the DLQ discovered from the RedrivePolicy, each with an
# SzReason message attribute, reported as rejected and marked on stdout. The
# queue name gets the test pid appended.
queue: sz-e2e-rejects
# Number of valid records generated from valid_template ({i} = 0..N-1).
valid_count: 12
valid_template: '{"DATA_SOURCE":"TEST","RECORD_ID":"SQS_E2E_{i}","NAME_FULL":"Sqs Tester {i}","EMAIL_ADDRESS":"sqs{i}@example.com"}'
unparseable: '{"DATA_SOURCE":"TEST","RECORD_ID":"SQS_BAD_PARSE",'
engine_reject: '{"DATA_SOURCE":"E2E_NO_SUCH_DSRC","RECORD_ID":"SQS_BAD_DSRC","NAME_FULL":"X Y"}'
# Seconds to wait for the two DLQ copies, then for the source to settle.
dlq_within_secs: 90
settle_within_secs: 60

# What the test asserts on.
markers:
  # Message attribute carrying the reject reason on each DLQ copy.
  reason_attribute: SzReason
  # SzReason prefix of the unparseable message's DLQ copy.
  poison_reason: "malformed record: "
  # The final line: rejects in the parenthetical ("{N}" = valid_count).
  final_total: "Processed total of {N} adds, "
  rejected: "(2 rejected, "
  engine_reject: "REJECTING: E2E_NO_SUCH_DSRC : SQS_BAD_DSRC -> "
  poison_warn: "DEAD-LETTERING malformed record: "
  poison_reject: "REJECTING:  :  -> malformed record: "
